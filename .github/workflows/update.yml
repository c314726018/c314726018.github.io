name: 更新贵金属行情

on:
  schedule:
    # 每 30 分钟一次（含周末夜盘）；非交易时段会复用缓存，不会空白
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取并构建
        run: |
          python fetch.py
          python build.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json docs/
          git commit -m "chore: 更新行情 $(date +%Y-%m-%dT%H:%M)" || echo "no changes"
          git push
      - name: IndexNow 推送（Bing / 360 / 搜狗 / Yandex 收录）
        run: |
          KEY="7f62035e56707ee1c721b77b11de07f8"
          curl -s -m 20 -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"c314726018.github.io","key":"'"$KEY"'","urlList":["https://c314726018.github.io/","https://c314726018.github.io/history.html","https://c314726018.github.io/about.html","https://c314726018.github.io/privacy.html"]}' \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n" || echo "IndexNow 推送失败（不影响构建）"
