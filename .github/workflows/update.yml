name: 更新贵金属行情

on:
  schedule:
    # 每小时一次（含周末夜盘）；非交易时段会复用缓存，不会空白
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取并构建
        run: |
          python fetch.py
          python build.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json docs/
          git commit -m "chore: 更新行情 $(date +%Y-%m-%dT%H:%M)" || echo "no changes"
          git push
