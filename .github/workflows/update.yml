name: 更新贵金属行情

on:
  # 仓库改名后 GitHub 的 schedule 调度失效（已知问题，恢复时间不定）。
  # 改用「自续链」：每次运行结束睡约 28 分钟后自我触发下一轮，形成永久 30 分钟循环。
  # 断链时手动 dispatch 一次即可重启。
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取并构建
        run: |
          python fetch.py
          python build.py
      - name: 邮件提醒比对与发信
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          ALERT_RULES: ${{ secrets.ALERT_RULES }}
        run: python compare_alerts.py || echo "提醒步骤失败(不影响构建)"
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json docs/ alerts_state.json
          git commit -m "chore: 更新行情 $(date +%Y-%m-%dT%H:%M)" || echo "no changes"
          git push
      - name: IndexNow 推送（Bing / 360 / 搜狗 / Yandex 收录）
        run: |
          KEY="7f62035e56707ee1c721b77b11de07f8"
          curl -s -m 20 -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"c314726018.github.io","key":"'"$KEY"'","urlList":["https://c314726018.github.io/","https://c314726018.github.io/history.html","https://c314726018.github.io/about.html","https://c314726018.github.io/privacy.html"]}' \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n" || echo "IndexNow 推送失败（不影响构建）"
      - name: 自续链（约 30 分钟后触发下一轮）
        if: always()
        run: |
          sleep 1720
          for i in 1 2 3; do
            gh workflow run update.yml --ref main && { echo "已触发下一轮 (attempt $i)"; exit 0; }
            echo "触发失败 attempt $i，60s 后重试"; sleep 60
          done
          echo "自续链失败：请手动 dispatch 重启"
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PAT }}
